name: hola-mundo
run-name: ¡Estoy aprendiendo GitHub Actions!
on: [push]
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checking out repository
        uses: actions/checkout@v3
      - name: Node Configuration
        uses: actions/setup-node@v6
        with:
          node-version: 19
      - name: Run index
        run: node index.js