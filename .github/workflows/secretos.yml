name: Saludo usando variables y seecretos
run-name: ¡Estoy aprendiendo a usar Variables y Secretos!
on:
  workflow_dispatch:
env:
  DIA_DE_SEMANA: Lunes
jobs:
  saludo-variables:
    runs-on: ubuntu-latest
    env:
      SALUDO: Hola
    steps:
      - name: Saludar
        run: echo "$SALUDO, ${{ vars.NOMBRE }}. Hoy es ${{ env.DIA_DE_SEMANA }}!"
  Saludo_secretos:
    runs-on: ubuntu-latest
    steps:
    - name: Echo de saludo con secreto
      run: echo "${{ env.SALUDO }} ${{ vars.NOMBRE }}, tu contraseña secreta es ${{ secrets.CONTRASEÑA }}"